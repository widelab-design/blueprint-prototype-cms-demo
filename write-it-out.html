<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint — Write it out</title>
<link rel="stylesheet" href="./foundations/tokens.css">
<style>

body { background: #0a0a0f; overflow: hidden; margin: 0; }
.bp-stage { position: fixed; inset: 0; display: grid; place-items: center; }
.bp-device {
  width: 1194px; height: 834px; position: relative; overflow: hidden;
  border-radius: 20px; transform-origin: center center;
  transform: scale(var(--s,1));
}

/* ─── Screen transitions ────────────────────────────────────── */
.screen {
  position: absolute; inset: 0;
  opacity: 0; pointer-events: none;
  transition: opacity 280ms cubic-bezier(0.4,0,0.2,1);
}
.screen.active { opacity: 1; pointer-events: all; }

/* ─── Status bar ────────────────────────────────────────────── */
.sb {
  position: absolute; top: 0; left: 0; right: 0; height: 24px; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 500;
  color: #fff; pointer-events: none;
}

/* ════════════════════════════════════════════════════════════
   SCREEN 1 — Write
   ════════════════════════════════════════════════════════════ */
#s-write { background: #b38aff; }

/* Dark circle background shape */
.write-bg-shape {
  position: absolute;
  width: 1910px; height: 1910px;
  border-radius: 50%;
  background: #1f1f25;
  left: -358px; top: 80px;
  pointer-events: none; z-index: 0;
}

/* back button */
.btn-back {
  position: absolute; top: 36px; left: 24px; z-index: 10;
  width: 48px; height: 48px; border-radius: 8px;
  background: rgba(255,255,255,0.16);
  border: none; cursor: pointer; display: grid; place-items: center;
  transition: background 120ms;
}
.btn-back:hover { background: rgba(255,255,255,0.24); }
.btn-back svg { width: 20px; height: 20px; }

/* header + content flow */
.write-body {
  position: absolute; top: 115px; left: 50%; transform: translateX(-50%); z-index: 5;
  width: 440px; display: flex; flex-direction: column; align-items: center;
}
.write-header {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  margin-bottom: 48px; width: 100%;
}
.spark-pill {
  display: flex; align-items: center; gap: 8px;
  background: #2f2f37; border-radius: 99px;
  padding: 8px 12px;
  font-family: var(--font-display); font-weight: 400; font-size: 20px; color: #f2f3e5; line-height: 1.05;
}
.write-title {
  font-family: var(--font-display); font-weight: 400; font-size: 32px; letter-spacing: -0.8px;
  color: #f2f3e5; margin: 0; line-height: 40px;
  text-align: center;
}

/* content area */
.write-content {
  width: 100%; display: flex; flex-direction: column; gap: 24px;
}

/* prompt carousel */
.prompt-carousel {
  position: relative; width: 100%; flex-shrink: 0;
}
.carousel-card {
  width: 100%; display: flex; align-items: flex-start; gap: 12px;
  padding: 10px; background: #b38aff;
}
.carousel-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 48px; height: 48px;
  background: rgba(255,255,255,0.16); border: none; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: opacity 150ms, background 150ms;
}
.carousel-arrow:hover:not(:disabled) { background: rgba(255,255,255,0.24); }
.carousel-arrow:disabled { opacity: 0.2; cursor: default; pointer-events: none; }
#carouselPrev { right: calc(100% + 12px); }
#carouselNext { left: calc(100% + 12px); }
.msg-avatar {
  width: 48px; height: 48px; background: #f2f3e5;
  flex-shrink: 0; display: grid; place-items: center;
}
.msg-monster { position: relative; width: 40px; height: 40px; }
.msg-butterfly { position: absolute; width: 36px; height: 36px; top: 2px; left: 2px; }
.msg-eyes {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 1px;
}
.msg-eye { width: 5.78px; height: 7.58px; display: block; }
.msg-text {
  font-family: var(--font-body); font-size: 20px; font-weight: 500;
  color: #2f2f37; line-height: 1.1; letter-spacing: -0.4px; flex: 1; margin: 0;
  padding-top: 2px; min-height: 2.2em;
  will-change: transform, opacity;
}

/* textarea */
.write-area {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 8px;
  position: relative;
}
.write-textarea {
  width: 100%; box-sizing: border-box;
  border: none; outline: none; resize: none;
  font-family: var(--font-body); font-size: 16px; font-weight: 600;
  color: #f2f3e5; padding: 10px 16px;
  background: transparent; min-height: 200px;
}
.write-textarea::placeholder { color: #adadad; font-weight: 400; }

/* save button */
.btn-save-wrap {
  position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%); z-index: 10;
}
.btn-save {
  width: 270px; height: 48px; border-radius: 8px;
  background: #f2f3e5; color: #1f1f25;
  font-family: var(--font-body); font-size: 16px; font-weight: 500;
  border: none; cursor: pointer; transition: opacity 150ms, transform 120ms;
  display: flex; align-items: center; justify-content: center;
}
.btn-save:active { transform: scale(0.97); }
.btn-save:disabled { opacity: 0.4; cursor: default; }

/* ════════════════════════════════════════════════════════════
   SCREEN 2 — Completed
   ════════════════════════════════════════════════════════════ */
#s-done { background: #1f1f25; }

.done-bg-shape {
  position: absolute;
  width: 1910px; height: 1910px;
  border-radius: 50%;
  background: #1f1f25;
  left: -358px; top: 80px;
  pointer-events: none; z-index: 0;
  opacity: 0.3;
}

.done-center {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.done-reward-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 24px;
}
.done-reward-text {
  font-family: var(--font-display); font-weight: 400; font-size: 32px; color: #f2f3e5; line-height: 1;
}
.done-card-wrap {
  width: 237px; height: 353px; position: relative;
  animation: float 3s ease-in-out infinite;
  margin-bottom: 28px;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-10px); }
}
.done-title {
  font-family: var(--font-display); font-weight: 400; font-size: 80px; line-height: 1;
  color: #f2f3e5; letter-spacing: 1px;
  text-align: center; margin: 0;
}

</style>
</head>
<body>

<div class="bp-stage">
<div class="bp-device" id="device">

  <!-- SCREEN 1 — Write -->
  <div class="screen active" id="s-write">
    <div class="write-bg-shape"></div>

    <div class="sb"><span>9:41 Mon Jun 6</span><span>100% 🔋</span></div>

    <button class="btn-back" onclick="history.back()">
      <svg viewBox="0 0 20 20" fill="none">
        <path d="M12 5L7 10L12 15" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="write-body">
      <div class="write-header">
        <div class="spark-pill" data-content="write_out_spark_pill">
          1 <img src="./components/spark-color.svg" alt="spark" style="width:20px;height:20px;display:block;">
        </div>
        <h1 class="write-title" data-content="write_out_title">Write it out</h1>
      </div>

      <div class="write-content">
        <div class="prompt-carousel">
          <button class="carousel-arrow" id="carouselPrev" onclick="selectCard(selectedIdx-1)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M10 3L5 8L10 13" stroke="#f2f3e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="carousel-card">
            <div class="msg-avatar"><div class="msg-monster">
              <img class="msg-butterfly" src="./components/monster-butterfly.svg" alt="">
              <div class="msg-eyes">
                <img class="msg-eye" src="./components/monster-eye.svg" alt="">
                <img class="msg-eye" src="./components/monster-eye.svg" alt="">
              </div>
            </div></div>
            <p class="msg-text" id="promptText"></p>
          </div>
          <button class="carousel-arrow" id="carouselNext" onclick="selectCard(selectedIdx+1)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6 3L11 8L6 13" stroke="#f2f3e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="write-area">
          <textarea
            class="write-textarea"
            id="noteInput"
            placeholder="Start writing here"
            oninput="onInput()"
            data-content-placeholder="write_out_textarea_placeholder"
          ></textarea>
        </div>
      </div>
    </div>

    <div class="btn-save-wrap">
      <button class="btn-save" id="btnSave" disabled onclick="saveNote()" data-content="btn_save">
        Save
      </button>
    </div>
  </div>

  <!-- SCREEN 2 — Completed -->
  <div class="screen" id="s-done">
    <div class="sb"><span>9:41 Mon Jun 6</span><span>100% 🔋</span></div>

    <div class="done-bg-shape"></div>

    <div class="done-center">
      <div class="done-reward-row">
        <span class="done-reward-text" data-content="write_out_reward_text">+50</span>
        <img src="./components/spark-color.svg" alt="spark" style="width:28px;height:28px;display:block;">
      </div>

      <div class="done-card-wrap">
        <img class="done-card-img" src="./components/card-x.svg" alt="Write it out">
      </div>

      <p class="done-title" data-content="write_out_completed">Completed!</p>
    </div>
  </div>

</div>
</div>

<script>
var PROMPTS = {
  excited:   ["What's making you feel this excited?", "What are you looking forward to most?", "What are you grateful for right now?"],
  okay:      ["What's been good about your day so far?", "What kinds of moments tend to lift your mood — even a little?", "What's one thing you appreciate today?"],
  curious:   ["What's been on your mind lately?", "What question keeps coming back to you?", "What are you hoping to figure out?"],
  meh:       ["What's been weighing on you lately?", "What would make today a tiny bit better?", "What's one small thing you can let go of?"],
  neutral:   ["What happened today that stood out?", "What are you carrying into tomorrow?", "What's one small thing that went well?"],
  idontknow: ["What's hard to put into words right now?", "What do you wish others understood about how you feel?", "What would help you feel a bit more settled?"]
};

var activePrompts = [];
var selectedIdx = 0;

function initPrompts() {
  var mood = localStorage.getItem('bp_mood_key') || 'okay';
  activePrompts = PROMPTS[mood] || PROMPTS.okay;
  selectedIdx = 0;
  renderCarousel();
}

function renderCarousel() {
  document.getElementById('promptText').textContent = activePrompts[selectedIdx] || '';
  document.getElementById('carouselPrev').disabled = selectedIdx === 0;
  document.getElementById('carouselNext').disabled = selectedIdx >= activePrompts.length - 1;
}

function selectCard(idx) {
  if (idx < 0 || idx >= activePrompts.length || idx === selectedIdx) return;
  var dir = idx > selectedIdx ? 1 : -1;
  var txt = document.getElementById('promptText');
  txt.style.transition = 'transform 160ms ease-in, opacity 160ms ease-in';
  txt.style.transform = 'translateX(' + (-40 * dir) + 'px)';
  txt.style.opacity = '0';
  setTimeout(function() {
    selectedIdx = idx;
    renderCarousel();
    txt.style.transition = 'none';
    txt.style.transform = 'translateX(' + (40 * dir) + 'px)';
    txt.style.opacity = '0';
    requestAnimationFrame(function() { requestAnimationFrame(function() {
      txt.style.transition = 'transform 240ms cubic-bezier(0.2,0,0,1), opacity 200ms ease-out';
      txt.style.transform = 'translateX(0)';
      txt.style.opacity = '1';
    }); });
  }, 170);
}

function scale() {
  const s = Math.min(innerWidth / 1194, innerHeight / 834) * 0.96;
  document.getElementById('device').style.setProperty('--s', s);
}
scale(); addEventListener('resize', scale);

let cur = 's-write';
function goTo(id) {
  document.getElementById(cur).classList.remove('active');
  document.getElementById(id).classList.add('active');
  cur = id;
}

function onInput() {
  const val = document.getElementById('noteInput').value.trim();
  document.getElementById('btnSave').disabled = val.length === 0;
}

function saveNote() {
  const val = document.getElementById('noteInput').value.trim();
  if (!val) return;

  try { sessionStorage.setItem('bp_write_text', val); } catch(e) {}
  try { localStorage.setItem('bp_write_text', val); } catch(e) {}
  localStorage.setItem('bp_write_done', '1');

  setTimeout(function() {
    window.location.href = 'completed.html?card=write';
  }, 400);
}

initPrompts();

// Pre-fill textarea if returning to edit
(function() {
  var saved = localStorage.getItem('bp_write_text') || sessionStorage.getItem('bp_write_text');
  if (saved) document.getElementById('noteInput').value = saved;
})();

onInput();
</script>
  <script src="./content-loader.js"></script>
</body>
</html>
