<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint — Collectible</title>
<script>(function(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1194,innerHeight/834)*0.96);})()</script>
<link rel="stylesheet" href="./foundations/tokens.css">
<style>

body { background: #0a0a0f; overflow: hidden; margin: 0; }
.bp-stage { position: fixed; inset: 0; display: grid; place-items: center; }
.bp-device {
  width: 1194px; height: 834px; position: relative; overflow: hidden;
  border-radius: 20px; transform-origin: center;
  transform: scale(var(--s,1)); background: #b38aff;
}

.sb {
  position: absolute; top: 0; left: 0; right: 0; height: 24px; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 500;
  color: rgba(255,255,255,0.9); pointer-events: none;
}

/* Cloud — same proportions as Figma: 1499×937 at left:-203 top:55 */
.coll-cloud {
  position: absolute;
  width: 1499px; height: 937px;
  left: -203px; top: 55px;
  pointer-events: none; z-index: 1;
  transform-origin: center center;
}
.coll-cloud img { width: 100%; height: 100%; display: block; }

/* Exit animations (back to sparks) */
.coll-cloud.exiting {
  transform: scale(3);
  transition: transform 900ms cubic-bezier(0.75,0,0.3,0.99);
}
.coll-content.exiting {
  opacity: 0;
  transform: translateY(400px);
  transition: transform 900ms cubic-bezier(0.75,0,0.3,0.99), opacity 900ms cubic-bezier(0.75,0,0.3,0.99);
}

/* Entrance animations */
.coll-cloud.from-sparks {
  transform: scale(3);
}
.coll-cloud.entered {
  transform: scale(1);
  transition: transform 900ms cubic-bezier(0.75,0,0.3,0.99);
}
.coll-content.from-sparks {
  opacity: 0;
  transform: translateY(400px);
}
.coll-content.entered {
  opacity: 1;
  transform: translateY(0);
  transition: transform 900ms cubic-bezier(0.75,0,0.3,0.99), opacity 900ms cubic-bezier(0.75,0,0.3,0.99);
}

/* Back button */
.coll-back {
  position: absolute; top: 48px; left: 24px; z-index: 20;
  width: 48px; height: 48px; border-radius: 8px;
  background: rgba(255,255,255,0.16); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
.coll-back svg { display: block; }

/* Centred content — full screen flex column */
.coll-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 36px;
  z-index: 5;
  padding: 100px 80px 0;
  box-sizing: border-box;
}

/* Artwork card */
.coll-card {
  width: 240px; height: 240px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #444450;
  flex-shrink: 0;
}
.coll-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Achievement text — max 3 lines at 627px */
.coll-text {
  width: 627px;
  font-family: var(--font-display); font-weight: 400; font-size: 80px; line-height: 1.06;
  letter-spacing: 1.5px; color: #f2f3e5; text-align: center; margin: 0;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

</style>
</head>
<body>

<div class="bp-stage">
<div class="bp-device">

  <div class="sb"><span>9:41 Mon Jun 6</span><span>100% 🔋</span></div>

  <!-- Cloud background -->
  <div class="coll-cloud">
    <img src="./components/cloud-1.svg" alt="">
  </div>

  <!-- Back -->
  <button class="coll-back" onclick="exitToSparks()">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M12.5 15.8334L6.66667 10L12.5 4.16669" stroke="#f2f3e5" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Centred content -->
  <div class="coll-content">
    <div class="coll-card">
      <img id="coll-img" src="./components/Frame-1308.svg" alt="Collectible artwork">
    </div>
    <h1 class="coll-text" id="coll-text">You were really consistent in May</h1>
  </div>

</div>
</div>

<script>
var COLLECTIBLES = {
  '1': {
    img:  './components/Frame-1305.svg',
    text: 'You showed up every day in April',
  },
  '2': {
    img:  './components/Frame-1307.svg',
    text: 'You explored your feelings in March',
  },
  '3': {
    img:  './components/Frame-1308.svg',
    text: 'You were really consistent in May',
  },
};

var params = new URLSearchParams(location.search);
var cid = params.get('c') || '3';
var c = COLLECTIBLES[cid] || COLLECTIBLES['3'];
document.getElementById('coll-img').src  = c.img;
document.getElementById('coll-text').textContent = c.text;

function exitToSparks() {
  var cloud   = document.querySelector('.coll-cloud');
  var content = document.querySelector('.coll-content');
  cloud.classList.add('exiting');
  content.classList.add('exiting');
  setTimeout(function() {
    window.location.href = 'sparks.html?back=1';
  }, 900);
}

if (params.get('anim') === '1') {
  var cloud   = document.querySelector('.coll-cloud');
  var content = document.querySelector('.coll-content');
  cloud.classList.add('from-sparks');
  content.classList.add('from-sparks');
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      cloud.classList.add('entered');
      content.classList.add('entered');
    });
  });
}
</script>

  <script src="./content-loader.js"></script>
</body>
</html>
