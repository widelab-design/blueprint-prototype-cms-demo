<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Debug Storage</title>
<style>body{font-family:monospace;padding:24px;background:#1f1f25;color:#f2f3e5;font-size:14px;}
button{background:#b38aff;border:none;padding:8px 16px;color:#fff;cursor:pointer;border-radius:6px;margin:4px;}
pre{background:#2b2b32;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;}
</style></head>
<body>
<h2>LocalStorage Debug</h2>
<button onclick="clearNotes()" style="background:#e65800;font-size:16px;padding:12px 24px;">Wyczysc notatki</button>
<button onclick="testRead()" style="margin-top:16px;background:#555;">Pokaz co jest zapisane</button>
<button onclick="resetVideo()" style="background:#555;">Reset "video watched"</button>
<button onclick="resetTour()" style="background:#3f50b8;">Reset tutorial (spotlight)</button>
<button onclick="resetBanner()" style="background:#219653;">Reset banera (today)</button>
<button onclick="addSparks(200)" style="background:#b38aff;">+ 200 sparks</button>
<button onclick="resetSparks()" style="background:#555;">Reset sparks do 0</button>
<button onclick="toggleSparkzGiving()" style="background:#1a6a8a;" id="btnSparkzGiving">Sparkz Giving: ...</button>
<button onclick="resetClassSparks()" style="background:#1a6a8a;">Reset class sparks do 12450</button>
<pre id="out">Kliknij przycisk...</pre>
<script>
var NOTE_KEYS = ['bp_write_text','bp_journal_q1','bp_journal_q2','bp_journal_notes','bp_today_sections'];

function clearNotes() {
  try {
    NOTE_KEYS.forEach(function(k) {
      localStorage.removeItem(k);
      sessionStorage.removeItem(k);
    });
    // also clear any bp_ keys that might exist
    var lsKeys = [];
    for (var i = 0; i < localStorage.length; i++) lsKeys.push(localStorage.key(i));
    lsKeys.filter(function(k){ return k.startsWith('bp_'); }).forEach(function(k){ localStorage.removeItem(k); });
    var ssKeys = [];
    for (var i = 0; i < sessionStorage.length; i++) ssKeys.push(sessionStorage.key(i));
    ssKeys.filter(function(k){ return k.startsWith('bp_'); }).forEach(function(k){ sessionStorage.removeItem(k); });
    document.getElementById('out').textContent = 'Notatki wyczyszczone. Mozesz wrocic do apki.';
  } catch(e) {
    document.getElementById('out').textContent = 'Blad:\n' + e.message;
  }
}
function testRead() {
  try {
    var all = 'localStorage:\n';
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      all += '  ' + k + ' = ' + localStorage.getItem(k).substring(0, 120) + '\n';
    }
    all += '\nsessionStorage:\n';
    for (var i = 0; i < sessionStorage.length; i++) {
      var k = sessionStorage.key(i);
      all += '  ' + k + ' = ' + sessionStorage.getItem(k).substring(0, 120) + '\n';
    }
    document.getElementById('out').textContent = all || '(pusto)';
  } catch(e) {
    document.getElementById('out').textContent = 'Blad:\n' + e.message;
  }
}
function resetVideo() {
  localStorage.removeItem('bp_video_watched');
  sessionStorage.removeItem('bp_video_watched');
  document.getElementById('out').textContent = 'bp_video_watched usuniety';
  testRead();
}
function resetTour() {
  localStorage.removeItem('bp_tour_done');
  document.getElementById('out').textContent = 'bp_tour_done usuniety — otworz today.html zeby zobaczyc tutorial od nowa.';
  testRead();
}
function resetBanner() {
  localStorage.removeItem('bp_banner_closed');
  document.getElementById('out').textContent = 'bp_banner_closed usuniety — baner pojawi sie ponownie na today.html.';
  testRead();
}
function addSparks(n) {
  var cur = parseInt(localStorage.getItem('bp_sparks') || '0', 10);
  var next = cur + n;
  localStorage.setItem('bp_sparks', next);
  document.getElementById('out').textContent = 'Dodano ' + n + ' sparkow. Teraz masz: ' + next + '.';
  testRead();
}
function resetSparks() {
  localStorage.setItem('bp_sparks', '0');
  document.getElementById('out').textContent = 'bp_sparks ustawione na 0.';
  testRead();
}
function toggleSparkzGiving() {
  var cur = localStorage.getItem('bp_sparkz_giving');
  var next = (cur === '0') ? '1' : '0';
  localStorage.setItem('bp_sparkz_giving', next);
  updateSparkzGivingBtn();
  document.getElementById('out').textContent = 'bp_sparkz_giving = ' + next + '\nOdswierz today.html zeby zobaczyc zmiane.';
  testRead();
}
function resetClassSparks() {
  localStorage.setItem('bp_class_sparks', '12450');
  document.getElementById('out').textContent = 'bp_class_sparks ustawione na 12450.';
  testRead();
}
function updateSparkzGivingBtn() {
  var cur = localStorage.getItem('bp_sparkz_giving');
  var enabled = cur !== '0';
  var btn = document.getElementById('btnSparkzGiving');
  if (btn) btn.textContent = 'Sparkz Giving: ' + (enabled ? 'WLACZONE (kliknij zeby wylaczyc)' : 'WYLACZONE (kliknij zeby wlaczyc)');
}
updateSparkzGivingBtn();
testRead();
</script>
</body>
</html>
