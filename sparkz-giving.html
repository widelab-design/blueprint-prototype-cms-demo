<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint — Sparkz Giving</title>
<script>(function(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1194,innerHeight/834)*0.96);})()</script>
<link rel="stylesheet" href="./foundations/tokens.css">
<style>

body { background: #0a0a0f; overflow: hidden; margin: 0; }
.bp-stage { position: fixed; inset: 0; display: grid; place-items: center; }
.bp-device {
  width: 1194px; height: 834px; position: relative; overflow: hidden;
  border-radius: 20px; transform-origin: center center;
  transform: scale(var(--s,1)); background: #1f1f25;
}

/* ─── Status bar ─────────────────────────────────────────────── */
.sb {
  position: absolute; top: 0; left: 0; right: 0; height: 24px; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 500;
  color: rgba(255,255,255,0.9); pointer-events: none;
}

/* ─── Back button ────────────────────────────────────────────── */
.back-btn {
  position: absolute; left: 24px; top: 48px;
  width: 48px; height: 48px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 20; transition: opacity 120ms;
}
.back-btn:active { opacity: 0.7; }

/* ─── Screen system ──────────────────────────────────────────── */
.screen {
  position: absolute; inset: 0;
  opacity: 0; pointer-events: none;
  transition: opacity 220ms ease;
}
.screen.active { opacity: 1; pointer-events: all; }

.spark-sm { width: 20px; height: 20px; display: inline-block; vertical-align: middle; flex-shrink: 0; }

/* ════════════════════════════════════════════════════════════════
   SCREEN 0 — Choose organisation
════════════════════════════════════════════════════════════════ */
#s-orgs { /* position: absolute; inset: 0 inherited from .screen */ }

.orgs-heading {
  position: absolute; top: 72px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-display); font-weight: 400; font-size: 80px;
  line-height: 1.06; letter-spacing: 1.5px; color: #f2f3e5;
  text-align: center; margin: 0; white-space: nowrap;
}
.orgs-sub {
  position: absolute; top: 182px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-body); font-size: 16px; font-weight: 500;
  color: rgba(242,243,229,0.4); text-align: center; white-space: nowrap;
}
.orgs-row {
  position: absolute; top: 264px; left: 50%; transform: translateX(-50%);
  width: 1076px; height: 510px;
  display: flex; gap: 24px;
}
.org-card {
  flex: 1; height: 510px;
  border-radius: 12px; border: 1px solid #36363f;
  overflow: hidden; cursor: pointer;
  position: relative; background: #1f1f25;
  transition: transform 180ms ease, box-shadow 180ms ease;
}
.org-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
.org-card-label {
  position: absolute; top: 15px; left: 15px; z-index: 2;
  font-family: var(--font-display); font-weight: 400; font-size: 24px;
  color: #f2f3e5; text-transform: uppercase; letter-spacing: -0.4px; line-height: 1.12;
}
.org-card-ilu {
  position: absolute; overflow: hidden;
}
.org-card-ilu img { width: 100%; height: 100%; object-fit: contain; object-position: center; }
.org-card-footer {
  position: absolute; bottom: -1px; left: -1px;
  width: 344px;
  background: #2f2f37; border: 1px solid #36363f; border-radius: 16px;
  padding: 16px; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 12px;
}
.org-card-stats { display: flex; justify-content: space-between; align-items: center; }
.org-card-total {
  font-family: var(--font-display); font-weight: 400; font-size: 24px;
  letter-spacing: -0.4px; line-height: 1.12; color: #f2f3e5;
  display: flex; align-items: center; gap: 8px;
}
.org-card-gave {
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  color: #a4a59f;
}
.org-card-bar-wrap { height: 4px; border-radius: 99px; background: #444450; position: relative; }
.org-card-bar-fill { position: absolute; left: 0; top: 0; height: 4px; border-radius: 99px; background: #f2f3e5; }
.org-card-pct-label {
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  color: #a4a59f;
}

/* ════════════════════════════════════════════════════════════════
   SCREEN 1 — Campaign detail
════════════════════════════════════════════════════════════════ */
#s-campaign { display: flex; flex-direction: row; }

.camp-left {
  width: 374px; flex-shrink: 0; height: 100%;
  position: relative; overflow: hidden;
}
.camp-left-video {
  position: absolute; top: 0; left: 0; right: 0; height: 59%;
  background: #111117 center/cover no-repeat;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  overflow: hidden;
}
.camp-left-video::after {
  content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.3); pointer-events: none;
}
.camp-left-video-play {
  position: relative; z-index: 1;
  width: 52px; height: 52px; border-radius: 50%;
  background: rgba(242,243,229,0.15); border: 1.5px solid rgba(242,243,229,0.35);
  display: flex; align-items: center; justify-content: center;
}
.camp-left-video-play svg { margin-left: 3px; }
.camp-left-info {
  position: absolute; top: 59%; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: 20px 32px;
}
.camp-left-why {
  font-family: var(--font-body); font-size: 12px; font-weight: 600;
  color: rgba(242,243,229,0.4); letter-spacing: 0;
  margin: 0 0 20px;
}
.camp-facts { display: flex; flex-direction: column; gap: 20px; }
.camp-fact { display: flex; gap: 12px; align-items: center; }
.camp-fact-icon {
  flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px;
  background: #444450; display: flex; align-items: center; justify-content: center;
}
.camp-fact-text {
  font-family: var(--font-body); font-size: 15px; font-weight: 500;
  color: #a4a59f; line-height: 1.35;
}

.camp-right {
  flex: 1; height: 100%;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.camp-right-inner {
  width: 450px; height: 100%;
  padding: 65px 0 56px; box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: space-between;
  align-items: center; text-align: center;
}
.camp-title {
  font-family: var(--font-display); font-weight: 400; font-size: 64px;
  line-height: 1.06; color: #f2f3e5; margin: 0 0 14px; text-align: center;
}
.camp-desc {
  font-family: var(--font-body); font-size: 15px; font-weight: 500;
  color: rgba(242,243,229,0.5); line-height: 1.5; margin: 0; text-align: center;
}
.camp-ring-section { display: flex; align-items: center; justify-content: center; }
.camp-ring-wrap {
  position: relative; width: 292px; height: 292px;
  display: flex; align-items: center; justify-content: center;
}
.camp-ring-svg { position: absolute; top: 0; left: 0; }
.camp-ring-track { fill: none; stroke: #444450; stroke-width: 32; stroke-linecap: round; }
.camp-ring-fill {
  fill: none; stroke-width: 18; stroke-linecap: round;
  stroke-dasharray: 0 798;
  transition: stroke-dasharray 800ms cubic-bezier(0.4,0,0.2,1);
}
.camp-ring-personal {
  fill: none; stroke-width: 18; stroke-linecap: round;
  stroke-dasharray: 0 798;
  transition: stroke-dasharray 800ms cubic-bezier(0.4,0,0.2,1);
}
.camp-ring-blob {
  position: absolute; display: none;
  align-items: center; justify-content: center;
  z-index: 10; cursor: default;
}
.camp-ring-blob img { width: 28px; height: auto; pointer-events: none; transform: scale(0.7); transform-origin: center; }
.camp-ring-blob-label {
  position: absolute; pointer-events: none;
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  color: rgba(242,243,229,0.55); white-space: nowrap;
  opacity: 0; transition: opacity 180ms;
}
.camp-ring-center {
  position: relative; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.camp-ring-num {
  font-family: var(--font-display); font-weight: 400; font-size: 48px;
  letter-spacing: 1.5px; color: #f2f3e5; line-height: 48px; margin-top: 20px;
}
.camp-ring-sub {
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  color: rgba(242,243,229,0.4); margin-top: 12px; letter-spacing: -0.1px;
}


.btn-donate {
  height: 48px; width: 270px;
  background: #f2f3e5; border: none; border-radius: 8px;
  font-family: var(--font-body); font-size: 16px; font-weight: 700;
  color: #1f1f25; cursor: pointer; letter-spacing: -0.1px;
  transition: opacity 120ms; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-donate:hover { opacity: 0.9; }
.btn-donate:active { opacity: 0.75; }

/* ════════════════════════════════════════════════════════════════
   SCREEN 2 — Donate Amount
════════════════════════════════════════════════════════════════ */
#s-donate {
  overflow: hidden;
  background: #1f1f25; /* overridden per org */
}
.donate-bg-shape {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -34%) scale(1.35);
  width: 1292px; height: auto;
  pointer-events: none; z-index: 0;
}
.donate-heading {
  position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
  width: 700px; z-index: 1;
  font-family: var(--font-display); font-weight: 400; font-size: 80px;
  letter-spacing: 1.5px; line-height: 1.06;
  color: #f2f3e5; text-align: center; margin: 0;
}
/* ─── Donate arc slider — identyczny komponent z emotion detail ── */
.donate-arc-wrap {
  position: absolute; top: 328px; left: 50%; transform: translateX(-50%);
  z-index: 1;
}
.arc-slider {
  position: relative; width: 532px; height: 310px;
  overflow: visible; outline: none;
  cursor: grab; -webkit-user-select: none; user-select: none;
}
.arc-slider.is-dragging { cursor: grabbing; }
.arc-slider svg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
.arc-slider__hit { position: absolute; inset: 0; }
.arc-slider__thumb {
  position: absolute; width: 104px; height: 104px; border-radius: 50%;
  background: #2f2f37; border: 10px solid #2f2f37;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; line-height: 1;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: none; will-change: left, top, transform;
  filter: drop-shadow(0 4px 20px rgba(0,0,0,.5));
  transition: none;
}
.arc-slider.is-dragging .arc-slider__thumb {
  transform: translate(-50%, -50%) scale(1.06);
  transition: transform .12s ease;
}
.arc-slider__pill {
  position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
  background: #2f2f37; border-radius: 99px; padding: 0 24px;
  min-width: 160px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.arc-slider__pill span {
  color: #f2f3e5; font-family: var(--font-body);
  font-size: 16px; font-weight: 700; line-height: normal; text-align: center;
}
.donate-impact-preview { display: none; }
.btn-confirm {
  position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%);
  height: 48px; width: 270px; z-index: 1;
  background: #f2f3e5; border: none; border-radius: 8px;
  font-family: var(--font-body); font-size: 16px; font-weight: 500;
  color: #1f1f25; cursor: pointer; letter-spacing: -0.1px;
  transition: opacity 120ms; opacity: 0.3; pointer-events: none;
  box-shadow: 0 1px 1px rgba(20,21,26,0.03);
}
.btn-confirm.ready { opacity: 1; pointer-events: all; }
.btn-confirm.ready:hover { opacity: 0.85; }
.btn-confirm.ready:active { opacity: 0.7; }

/* ════════════════════════════════════════════════════════════════
   SCREEN 3 — Confirmation
════════════════════════════════════════════════════════════════ */
#s-thanks {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 80px 120px; box-sizing: border-box; gap: 28px; text-align: center;
}
.thanks-icon { width: 72px; height: 72px; flex-shrink: 0; }
.thanks-headline {
  font-family: var(--font-display); font-weight: 400; font-size: 64px;
  line-height: 1.06; color: #f2f3e5; margin: 0;
}
.thanks-donated {
  font-family: var(--font-display); font-weight: 400; font-size: 40px;
  line-height: 1; letter-spacing: -1px;
  color: var(--org-color, #49aee1);
  display: flex; align-items: center; gap: 8px; justify-content: center;
}
.thanks-progress-wrap { display: flex; flex-direction: column; gap: 12px; width: 520px; }
.thanks-progress-label {
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  color: rgba(242,243,229,0.5); text-align: center;
}
.thanks-bar-wrap { position: relative; height: 8px; background: #2b2b32; border-radius: 99px; }
.thanks-bar-fill {
  position: absolute; left: 0; top: 0; height: 8px;
  background: var(--org-color, #49aee1); border-radius: 99px;
  transition: width 1000ms cubic-bezier(0.4,0,0.2,1);
}
.thanks-pct {
  font-family: var(--font-display); font-weight: 400; font-size: 24px;
  letter-spacing: -0.5px; color: #f2f3e5;
}
.thanks-msg {
  font-family: var(--font-body); font-size: 16px; font-weight: 500;
  color: rgba(242,243,229,0.5); line-height: 1.5; max-width: 440px;
}
.thanks-balance {
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  color: rgba(242,243,229,0.35); display: flex; align-items: center; gap: 4px; justify-content: center;
}
.btn-done {
  height: 56px; width: 280px; margin-top: 8px;
  background: #f2f3e5; border: none; border-radius: 12px;
  font-family: var(--font-body); font-size: 16px; font-weight: 700;
  color: #1f1f25; cursor: pointer; letter-spacing: -0.1px; transition: opacity 120ms;
}
.btn-done:hover { opacity: 0.85; }
.btn-done:active { opacity: 0.7; }

/* ════════════════════════════════════════════════════════════════
   SCREEN — My Giving (landing when student has donation history)
════════════════════════════════════════════════════════════════ */
#s-my-giving { display: flex; flex-direction: row; }

.myg-visual {
  width: 420px; flex-shrink: 0; height: 100%;
  display: flex; flex-direction: column; justify-content: center;
  padding: 80px 40px 60px; box-sizing: border-box;
  position: relative; overflow: hidden;
}
.myg-visual::before {
  content: ''; position: absolute; top: -200px; left: -100px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--org-color-a, rgba(73,174,225,0.12)) 0%, transparent 70%);
  pointer-events: none;
}
.myg-eyebrow {
  font-family: var(--font-body); font-size: 12px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--org-color, #49aee1); margin: 0 0 16px;
}
.myg-total {
  font-family: var(--font-display); font-weight: 400; font-size: 72px;
  line-height: 1; letter-spacing: -2px; color: #f2f3e5;
  display: flex; align-items: center; gap: 12px;
}
.myg-total-sub {
  font-family: var(--font-body); font-size: 15px; font-weight: 500;
  color: rgba(242,243,229,0.4); margin: 10px 0 28px;
}
.myg-sep { height: 1px; background: rgba(255,255,255,0.08); margin: 0 0 24px; }
.myg-last-label {
  font-family: var(--font-body); font-size: 11px; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase;
  color: rgba(242,243,229,0.3); margin: 0 0 10px;
}
.myg-last-row { display: flex; align-items: center; gap: 12px; }
.myg-last-info { display: flex; flex-direction: column; gap: 3px; }
.myg-last-org {
  font-family: var(--font-body); font-size: 15px; font-weight: 700; color: #f2f3e5;
}
.myg-last-amt {
  font-family: var(--font-body); font-size: 13px; font-weight: 500;
  color: rgba(242,243,229,0.4); display: flex; align-items: center; gap: 4px;
}
.myg-count-text {
  font-family: var(--font-body); font-size: 12px; font-weight: 500;
  color: rgba(242,243,229,0.2); margin: 20px 0 0;
}

.myg-info {
  flex: 1; height: 100%;
  padding: 80px 60px 60px; box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
}
.myg-class-eyebrow {
  font-family: var(--font-body); font-size: 12px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; color: rgba(242,243,229,0.3); margin: 0 0 6px;
}
.myg-class-name {
  font-family: var(--font-display); font-weight: 400; font-size: 36px;
  line-height: 1.1; color: #f2f3e5; margin: 0 0 24px;
}
.myg-bar-wrap {
  position: relative; height: 8px; background: #2b2b32; border-radius: 99px; margin-bottom: 12px;
}
.myg-bar-fill {
  position: absolute; left: 0; top: 0; height: 8px;
  background: var(--org-color, #49aee1); border-radius: 99px;
  width: 0%; transition: width 800ms cubic-bezier(0.4,0,0.2,1);
}
.myg-bar-nums { display: flex; justify-content: space-between; align-items: center; }
.myg-bar-current {
  font-family: var(--font-display); font-weight: 400; font-size: 28px;
  line-height: 1; letter-spacing: -0.8px; color: #f2f3e5;
  display: flex; align-items: center; gap: 8px;
}
.myg-bar-goal {
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  color: rgba(242,243,229,0.4);
}
.myg-share-box {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.myg-share-label {
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  color: rgba(242,243,229,0.45);
}
.myg-share-value {
  font-family: var(--font-display); font-weight: 400; font-size: 28px;
  letter-spacing: -0.5px; color: var(--org-color, #49aee1);
}
.myg-cta-wrap { display: flex; flex-direction: column; gap: 10px; }
.btn-give-more {
  height: 56px; width: 100%;
  background: var(--org-color, #49aee1); border: none; border-radius: 12px;
  font-family: var(--font-body); font-size: 16px; font-weight: 700;
  color: var(--org-dark, #0d2234); cursor: pointer; letter-spacing: -0.1px;
  transition: opacity 120ms; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-give-more:hover { opacity: 0.9; }
.btn-give-more:active { opacity: 0.75; }
.btn-explore {
  height: 44px; background: transparent; border: none;
  font-family: var(--font-body); font-size: 15px; font-weight: 500;
  color: rgba(242,243,229,0.35); cursor: pointer; transition: color 120ms;
}
.btn-explore:hover { color: rgba(242,243,229,0.6); }

</style>
</head>
<body>

<div class="bp-stage">
<div class="bp-device" id="device">

  <div class="sb"><span>9:41 Mon Jun 6</span><span>100% 🔋</span></div>

  <!-- ══════════════════════════════════════════════════════════
       SCREEN — My Giving (shown when student has donation history)
  ══════════════════════════════════════════════════════════════ -->
  <div id="s-my-giving" class="screen">

    <button class="back-btn" onclick="window.location.href='today.html'">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6" stroke="#f2f3e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Left: personal stats -->
    <div class="myg-visual" id="mygVisual">
      <p class="myg-eyebrow">Your giving</p>
      <div class="myg-total" id="mygTotal">— <img class="spark-sm" src="./components/spark-color.svg" alt=""></div>
      <p class="myg-total-sub">Sparks given to good causes</p>
      <div class="myg-sep"></div>
      <p class="myg-last-label">Last donation</p>
      <div class="myg-last-row" id="mygLastRow"><!-- filled by JS --></div>
      <p class="myg-count-text" id="mygCount"></p>
    </div>

    <!-- Right: class progress -->
    <div class="myg-info">
      <div>
        <p class="myg-class-eyebrow">Your class</p>
        <h2 class="myg-class-name" id="mygClassName"></h2>
        <div class="myg-bar-wrap">
          <div class="myg-bar-fill" id="mygBarFill"></div>
        </div>
        <div class="myg-bar-nums">
          <div class="myg-bar-current" id="mygBarCurrent">— <img class="spark-sm" src="./components/spark-color.svg" alt=""></div>
          <span class="myg-bar-goal" id="mygBarGoal"></span>
        </div>
      </div>

      <div class="myg-share-box">
        <span class="myg-share-label">Your share of the class total</span>
        <span class="myg-share-value" id="mygShareValue">—%</span>
      </div>

      <div class="myg-cta-wrap">
        <button class="btn-give-more" onclick="giveMoreSparks()">
          Give more Sparks
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

function factIcon(type) {

    drop:  '<path d="M10 3L5.5 9.5a5 5 0 109 0L10 3z" stroke="'+s+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',

    arrow: '<path d="M3 10h14M12 6l4 4-4 4" stroke="'+s+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
    leaf:  '<path d="M4 16c0-6 5.5-12 13-12-1.5 4-4 7-6.5 9S7 16 4 16z" stroke="'+s+'" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M4 16l5-5" stroke="'+s+'" stroke-width="1.5" stroke-linecap="round" fill="none"/>',
    check: '<path d="M4 10l4 4 8-8" stroke="'+s+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
    fork:  '<path d="M7 3v14M5 3v4a2 2 0 004 0V3M13 3v14M13 3c2 0 3 1 3 3s-1 3-3 3" stroke="'+s+'" stroke-width="1.5" stroke-linecap="round" fill="none"/>',
    heart: '<path d="M10 15.5l-6-5.8A3.8 3.8 0 015.9 3C7 3 8 3.5 8.8 4.3L10 5.5l1.2-1.2A3.8 3.8 0 0114.1 3 3.8 3.8 0 0116 9.7l-6 5.8z" fill="'+s+'"/>'
  };
  return '<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">' + (paths[type] || paths.arrow) + '</svg>';
}

// ─── SVG icons ────────────────────────────────────────────────
function orgIcon(type, size, color) {
  size = size || 56;
  color = color || 'currentColor';
  if (type === 'drop') {
    return '<svg width="' + size + '" height="' + Math.round(size * 1.23) + '" viewBox="0 0 56 69" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M28 3 C28 3 50 32 50 46 C50 58.7 40.15 68 28 68 C15.85 68 6 58.7 6 46 C6 32 28 3 28 3Z" fill="' + color + '" opacity="0.25"/>' +
      '<path d="M28 12 C28 12 46 36 46 46 C46 56.49 37.94 65 28 65 C18.06 65 10 56.49 10 46 C10 36 28 12 28 12Z" fill="' + color + '" opacity="0.6"/>' +
      '<path d="M28 22 C28 22 42 40 42 46 C42 54.28 35.73 61 28 61 C20.27 61 14 54.28 14 46 C14 40 28 22 28 22Z" fill="' + color + '"/>' +
      '<path d="M20 42 C20 37 23 34 28 34" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>' +
      '</svg>';
  }
  if (type === 'leaf') {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M28 6 C28 6, 52 16, 50 34 C48 50, 32 54, 18 48 C6 42, 4 28, 8 18 C12 8, 28 6 28 6Z" fill="' + color + '" opacity="0.3"/>' +
      '<path d="M28 10 C28 10, 48 20, 46 34 C44 48, 30 52, 18 46 C10 42, 8 30, 12 20 C16 10, 28 10 28 10Z" fill="' + color + '" opacity="0.6"/>' +
      '<path d="M28 14 C28 14, 44 24, 42 36 C40 46, 28 50, 18 44 C12 40, 12 30, 16 22 C20 14 28 14 28 14Z" fill="' + color + '"/>' +
      '<path d="M20 46 C20 46, 22 32, 28 14" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>' +
      '<path d="M20 36 C20 36, 28 34, 36 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>' +
      '</svg>';
  }
  if (type === 'heart') {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M28 48 C28 48, 6 34, 6 20 C6 12, 12 6, 20 8 C24 9, 27 12, 28 14 C29 12, 32 9, 36 8 C44 6, 50 12, 50 20 C50 34, 28 48, 28 48Z" fill="' + color + '" opacity="0.3"/>' +
      '<path d="M28 44 C28 44, 9 31, 9 20 C9 13.4, 14 8.5, 21 10 C24.5 11, 27 14, 28 16 C29 14, 31.5 11, 35 10 C42 8.5, 47 13.4, 47 20 C47 31, 28 44, 28 44Z" fill="' + color + '" opacity="0.65"/>' +
      '<path d="M28 40 C28 40, 12 28, 12 20 C12 15, 16 11, 22 12.5 C25 13.5, 27 16, 28 18 C29 16, 31 13.5, 34 12.5 C40 11, 44 15, 44 20 C44 28, 28 40, 28 40Z" fill="' + color + '"/>' +
      '</svg>';
  }
  return '';
}

// ─── Set org CSS vars on device ───────────────────────────────
function setOrgColors(org) {
  var dev = document.getElementById('device');
  dev.style.setProperty('--org-color', org.color);
  dev.style.setProperty('--org-dark',  org.darkBg);
  dev.style.setProperty('--org-color-a', hexToRgba(org.color, 0.15));
}

function hexToRgba(hex, a) {
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ─── Render org cards ─────────────────────────────────────────
(function renderOrgs() {
  var personalByOrg = {};
  donations.forEach(function(d) {
    personalByOrg[d.orgId] = (personalByOrg[d.orgId] || 0) + d.amount;
  });

  var row = document.getElementById('orgsRow');
  ORGS.forEach(function(org) {
    var classTotal = parseInt(localStorage.getItem('bp_class_sparks_' + org.id) || org.classTotal, 10);

          '<span class="org-card-total">' + classTotal.toLocaleString() + ' <img class="spark-sm" src="./components/spark-color.svg" alt="" style="width:20px;height:20px;"></span>' +

        '<div class="org-card-bar-wrap">' +
          '<div class="org-card-bar-fill" style="width:' + pct + '%"></div>' +
        '</div>' +
        '<div class="org-card-pct-label">' + pct + '% of a goal reached</div>' +
      '</div>';
    row.appendChild(card);
  });
})();

// ─── Select org & populate campaign screen ────────────────────
function populateMyGiving() {
  if (!donations.length) return;
  var personalTotal = donations.reduce(function(s, d) { return s + d.amount; }, 0);
  document.getElementById('mygTotal').innerHTML = personalTotal + ' <img class="spark-sm" src="./components/spark-color.svg" alt="">';
  var totalCount = donations.length;
  document.getElementById('mygCount').textContent = totalCount + ' donation' + (totalCount !== 1 ? 's' : '') + ' total';

  var last = donations[donations.length - 1];
  var lastOrg = null;
  for (var i = 0; i < ORGS.length; i++) { if (ORGS[i].id === last.orgId) { lastOrg = ORGS[i]; break; } }

  document.getElementById('mygLastRow').innerHTML =
    '<div style="flex-shrink:0">' + orgIcon(lastOrg ? lastOrg.icon : 'drop', 36, lastOrg ? lastOrg.color : '#49aee1') + '</div>' +
    '<div class="myg-last-info">' +
      '<span class="myg-last-org">' + last.orgName + '</span>' +
      '<span class="myg-last-amt">' + last.amount + ' <img class="spark-sm" src="./components/spark-color.svg" alt="" style="width:14px;height:14px;"> Sparks</span>' +
    '</div>';

  if (lastOrg) {
    setOrgColors(lastOrg);
    document.getElementById('mygVisual').style.background = lastOrg.darkBg;

    var classTotal = parseInt(localStorage.getItem('bp_class_sparks_' + lastOrg.id) || lastOrg.classTotal, 10);
    var pct = Math.min(100, Math.round(classTotal / lastOrg.goal * 100));

    document.getElementById('mygClassName').textContent = lastOrg.campaign;
    document.getElementById('mygBarCurrent').innerHTML = classTotal.toLocaleString() + ' <img class="spark-sm" src="./components/spark-color.svg" alt="">';
    document.getElementById('mygBarGoal').textContent = 'goal: ' + lastOrg.goal.toLocaleString() + ' ✦';

    var personalForOrg = 0;
    for (var j = 0; j < donations.length; j++) {
      if (donations[j].orgId === lastOrg.id) personalForOrg += donations[j].amount;
    }
    var sharePct = classTotal > 0 ? Math.max(1, Math.round(personalForOrg / classTotal * 100)) : 0;
    document.getElementById('mygShareValue').textContent = sharePct + '%';

    window._mygLastOrg = lastOrg;
    setTimeout(function() {
      var fill = document.getElementById('mygBarFill');
      if (fill) fill.style.width = pct + '%';
    }, 100);
  }
}

function giveMoreSparks() {
  if (window._mygLastOrg) {
    selectOrg(window._mygLastOrg);

    goTo('s-orgs');

function selectOrg(org) {
  campBackDest = cur;
  selectedOrg = org;
  selectedAmt = 0;

  var classTotal = parseInt(localStorage.getItem('bp_class_sparks_' + org.id) || org.classTotal, 10);
  var pct = Math.min(100, Math.round(classTotal / org.goal * 100));

  setOrgColors(org);

  // Left panel
  document.getElementById('campLeft').style.background = '#2b2b32';

  // Left panel: video + why + facts
  var videoEl = document.getElementById('campLeftVideo');
  videoEl.style.backgroundImage = org.photo ? 'url(' + org.photo + ')' : 'none';
  document.getElementById('campWhyName').textContent = org.name;
  document.getElementById('campFacts').innerHTML = (org.facts || []).map(function(f) {
    return '<div class="camp-fact"><div class="camp-fact-icon">' + factIcon(f.icon) + '</div><span class="camp-fact-text">' + f.text + '</span></div>';
  }).join('');

  // Right panel
  document.getElementById('campTitle').textContent = org.campaign;
  document.getElementById('campDesc').textContent = org.desc;

  // Ring — rebuild gradient stops per org
  var stops = org.gradStops || [{offset:'0%',color:'#6A7EFF'},{offset:'100%',color:'#2A315D'}];
  document.getElementById('campRingGrad').innerHTML = stops.map(function(s) {
    return '<stop offset="' + s.offset + '" stop-color="' + s.color + '"/>';
  }).join('');
  var circumference = 2 * Math.PI * 130;
  var fillLen = Math.max(0, pct / 100 * circumference);
  var ringFill = document.getElementById('campRingFill');
  ringFill.style.stroke = 'url(#campRingGrad)';
  ringFill.style.strokeDasharray = '0 ' + circumference;
  document.getElementById('campRingNum').textContent = classTotal.toLocaleString();
  document.getElementById('campRingGoal').textContent = '/' + org.goal.toLocaleString();

  goTo('s-campaign');

  // Personal donation arc + blob
  var personalByOrg2 = {};
  donations.forEach(function(d) { personalByOrg2[d.orgId] = (personalByOrg2[d.orgId]||0) + d.amount; });
  var personalAmt = personalByOrg2[org.id] || 0;
  var personalArc = document.getElementById('campRingPersonal');
  var blob = document.getElementById('campRingBlob');
  var blobLabel = document.getElementById('campRingBlobLabel');

  personalArc.style.stroke = org.personalColor || '#6A7EFF';
  personalArc.style.strokeDasharray = '0 ' + circumference;
  personalArc.setAttribute('transform', 'rotate(-90 146 146)');

  if (personalAmt > 0) {
    var minFill = circumference * 0.05;
    var personalFillLen = Math.max(minFill, (personalAmt / org.goal) * circumference);

    // Personal arc starts at zero (12 o'clock) same as fill
    // Eyes sit at end of personal arc
    var personalEndAngleDeg = -90 + (personalFillLen / circumference) * 360;
    var personalEndAngleRad = personalEndAngleDeg * Math.PI / 180;
    var blobCX = 146 + 130 * Math.cos(personalEndAngleRad);
    var blobCY = 146 + 130 * Math.sin(personalEndAngleRad);

    blob.style.display = 'flex';
    blob.style.left = blobCX + 'px';
    blob.style.top = blobCY + 'px';
    blob.style.transform = 'translate(-50%,-50%)';

    document.getElementById('campBlobAmt').textContent = personalAmt;

    var labelOffX = blobCX > 146 ? 40 : -180;
    blobLabel.style.left = (blobCX + labelOffX) + 'px';
    blobLabel.style.top = (blobCY - 14) + 'px';

    var hideTimer;
    var showLabel = function() { clearTimeout(hideTimer); blobLabel.style.opacity = '1'; };
    var hideLabel = function() { hideTimer = setTimeout(function() { blobLabel.style.opacity = '0'; }, 80); };
    personalArc.onmouseenter = showLabel;
    personalArc.onmouseleave = hideLabel;
    blob.onmouseenter = showLabel;
    blob.onmouseleave = hideLabel;

    setTimeout(function() {
      personalArc.style.strokeDasharray = personalFillLen + ' ' + circumference;
    }, 50);
  } else {
    blob.style.display = 'none';
    personalArc.style.strokeDasharray = '0 ' + circumference;
  }

  setTimeout(function() {
    ringFill.style.strokeDasharray = fillLen + ' ' + circumference;
  }, 50);
}

// ─── Donate arc slider ───────────────────────────────────────
var DA_CX = 263, DA_CY = 247, DA_RM = 190.5;
var DA_FILL_START = 175, DA_TRACK_END = 5;
var DA_A_MAX = 170, DA_A_MIN = 10;
var daAngle = DA_A_MAX;

function daPt(r, deg) {
  var rad = deg * Math.PI / 180;
  return [DA_CX + r * Math.cos(rad), DA_CY - r * Math.sin(rad)];
}
function daArcPath(a1, a2) {
  if (a1 - a2 < 0.4) a2 = a1 - 0.4;
  var p1 = daPt(DA_RM, a1), p2 = daPt(DA_RM, a2);
  var la = (a1 - a2) >= 180 ? 1 : 0;
  var r = function(n) { return Math.round(n * 10) / 10; };
  return 'M' + r(p1[0]) + ',' + r(p1[1]) + ' A' + DA_RM + ',' + DA_RM + ' 0 ' + la + ',1 ' + r(p2[0]) + ',' + r(p2[1]);
}
function daClientToAngle(e) {
  var rect = document.getElementById('donateArc').getBoundingClientRect();
  var t = e.touches ? e.touches[0] : e;
  var sx = rect.width / 532, sy = rect.height / 248;
  var x = (t.clientX - rect.left) / sx;
  var y = (t.clientY - rect.top) / sy;
  return Math.atan2(DA_CY - y, x - DA_CX) / (Math.PI / 180);
}
function daMoveToAngle(a) {
  a = Math.max(DA_A_MIN, Math.min(DA_A_MAX, a));
  daAngle = a;
  document.getElementById('donateTrack').setAttribute('d', daArcPath(DA_FILL_START, DA_TRACK_END));
  document.getElementById('donateFill').setAttribute('d', daArcPath(DA_FILL_START, a));
  var pos = daPt(DA_RM, a);
  var thumb = document.getElementById('donateArcThumb');
  thumb.style.left = pos[0] + 'px';
  thumb.style.top  = pos[1] + 'px';
  var t = (DA_A_MAX - a) / (DA_A_MAX - DA_A_MIN);
  var amount = Math.max(1, Math.round(t * Math.max(1, userSparks)));
  selectedAmt = amount;
  document.getElementById('donateArcNum').textContent = amount;
  document.getElementById('donateArcBalance').textContent = ' / ' + userSparks + ' Sparks';
  var btn = document.getElementById('btnConfirm');
  if (amount >= 1 && amount <= userSparks) {
    btn.classList.add('ready');
    btn.textContent = 'Donate ' + amount + ' Sparks';
  } else {
    btn.classList.remove('ready');
    btn.textContent = 'Not enough Sparks';
  }
}
function initDonateArc() {
  var gradLight = selectedOrg && selectedOrg.gradStops ? selectedOrg.gradStops[0].color : '#6A7EFF';
  var gradDark  = selectedOrg && selectedOrg.gradStops ? selectedOrg.gradStops[selectedOrg.gradStops.length - 1].color : '#2A315D';
  var thumbColor = selectedOrg ? (selectedOrg.personalColor || gradLight) : '#6A7EFF';

  document.getElementById('donateGradStop1').setAttribute('stop-color', gradDark);
  document.getElementById('donateGradStop2').setAttribute('stop-color', gradLight);
  document.getElementById('donateArcThumb').style.background = thumbColor;
  document.getElementById('donateArcThumb').style.borderColor = '#2f2f37';

  // Dots identical to emotion screen
  var NS = 'http://www.w3.org/2000/svg';
  var stops3 = [DA_A_MAX, (DA_A_MAX + DA_A_MIN) / 2, DA_A_MIN];
  var dotsG = document.getElementById('donateDots');
  dotsG.innerHTML = '';
  stops3.forEach(function(a) {
    var p = daPt(DA_RM, a);
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', Math.round(p[0] * 10) / 10);
    c.setAttribute('cy', Math.round(p[1] * 10) / 10);
    c.setAttribute('r', '7');
    c.setAttribute('fill', '#18181f');
    dotsG.appendChild(c);
  });

  document.getElementById('btnConfirm').classList.remove('ready');
  document.getElementById('btnConfirm').textContent = 'Donate Sparks';
  var startAmt = Math.max(1, Math.min(10, userSparks));
  var startT = startAmt / Math.max(1, userSparks);
  daMoveToAngle(DA_A_MAX - startT * (DA_A_MAX - DA_A_MIN));
}
function openDonateScreen() {
  initDonateArc();
  var screen = document.getElementById('s-donate');
  if (selectedOrg) {
    screen.style.background = selectedOrg.gradStops[0].color;
    var shape = document.getElementById('donateBgShape');
    shape.src = selectedOrg.bigShape || '';
    shape.style.display = selectedOrg.bigShape ? 'block' : 'none';
  }
  goTo('s-donate');
}
(function() {
  var slider = document.getElementById('donateArc');
  var thumb  = document.getElementById('donateArcThumb');
  var hit    = document.getElementById('donateArcHit');
  var dragging = false;
  function onStart(e) {
    dragging = true; slider.classList.add('is-dragging'); e.preventDefault();
    daMoveToAngle(daClientToAngle(e));
  }
  function onMove(e) {
    if (!dragging) return; e.preventDefault(); daMoveToAngle(daClientToAngle(e));
  }
  function onEnd() {
    if (!dragging) return; dragging = false; slider.classList.remove('is-dragging');
  }
  hit.addEventListener('mousedown',  onStart);
  thumb.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup',   onEnd);
  hit.addEventListener('touchstart',  onStart, { passive: false });
  thumb.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('touchmove', onMove,  { passive: false });
  window.addEventListener('touchend',  onEnd);
  slider.addEventListener('keydown', function(e) {
    var step = (DA_A_MAX - DA_A_MIN) / Math.max(10, userSparks);
    if (e.key === 'ArrowRight') daMoveToAngle(daAngle - step);
    if (e.key === 'ArrowLeft')  daMoveToAngle(daAngle + step);
  });
})();

// ─── Confirm donation ─────────────────────────────────────────
function confirmDonate() {
  if (!selectedAmt || !selectedOrg || selectedAmt > userSparks) return;

  var orgKey = 'bp_class_sparks_' + selectedOrg.id;
  var classTotal = parseInt(localStorage.getItem(orgKey) || selectedOrg.classTotal, 10);

  userSparks  -= selectedAmt;
  classTotal  += selectedAmt;
  var newPct   = Math.min(100, Math.round(classTotal / selectedOrg.goal * 100));
  var remaining = Math.max(0, selectedOrg.goal - classTotal);

  localStorage.setItem('bp_sparks', userSparks);
  localStorage.setItem(orgKey, classTotal);
  localStorage.setItem('bp_class_sparks', classTotal); // also update generic key for today.html

  donations.push({ orgId: selectedOrg.id, orgName: selectedOrg.name, amount: selectedAmt });
  try { localStorage.setItem('bp_sparkz_donations', JSON.stringify(donations)); } catch(e) {}

  // Populate thanks screen
  document.getElementById('thanksIconWrap').innerHTML = orgIcon(selectedOrg.icon, 72, selectedOrg.color);
  document.getElementById('thanksAmount').textContent = selectedAmt + ' Sparks!';
  document.getElementById('thanksAmount').style.color = selectedOrg.color;
  document.getElementById('thanksPct').textContent = newPct + '%';
  document.getElementById('thanksProgressMsg').textContent = 'Your class is ' + newPct + '% there';
  document.getElementById('thanksMsg').textContent = remaining > 0
    ? 'Just ' + remaining.toLocaleString() + ' more Sparks to go. Every contribution brings your class closer.'
    : 'Your class reached the goal! 🎉 Amazing work.';
  document.getElementById('thanksBalance').innerHTML =
    'You have ' + userSparks + ' <img class="spark-sm" src="./components/spark-color.svg" alt="" style="vertical-align:middle"> remaining';

  goTo('s-thanks');

  setTimeout(function() {
    document.getElementById('thanksBarFill').style.width = newPct + '%';
  }, 50);
}

// ─── Done ─────────────────────────────────────────────────────
function doneDonate() {
  window.location.href = 'today.html';
}

function scale() {
  var s = Math.min(innerWidth / 1194, innerHeight / 834) * 0.96;
  document.getElementById('device').style.setProperty('--s', s);
}
scale(); addEventListener('resize', scale);

</script>
