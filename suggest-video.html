<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint — Video Suggestion</title>
<script>(function(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1194,innerHeight/834)*0.96);})()</script>
<link rel="stylesheet" href="./foundations/tokens.css">
<style>

body { background: #0a0a0f; overflow: hidden; margin: 0; }
.bp-stage { position: fixed; inset: 0; display: grid; place-items: center; }
.bp-device {
  width: 1194px; height: 834px; position: relative; overflow: hidden;
  border-radius: 20px; transform-origin: center;
  transform: scale(var(--s,1));
}

.sb {
  position: absolute; top: 0; left: 0; right: 0; height: 24px; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 500;
  color: #fff; pointer-events: none;
}

.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: block; }

/* Blue bg + dark dome */
.sv-bg   { position: absolute; inset: 0; background: #49aee1; }
.sv-dome {
  position: absolute;
  width: 1910px; height: 1910px;
  left: 50%; top: 69px;
  transform: translateX(-50%);
  background: #1f1f25; border-radius: 50%;
  pointer-events: none;
}

.btn-back {
  position: absolute; top: 48px; left: 24px; z-index: 20;
  width: 48px; height: 48px; border-radius: 8px;
  background: rgba(255,255,255,0.16); border: none; cursor: pointer;
  display: grid; place-items: center; transition: background 120ms;
}
.btn-back:hover { background: rgba(255,255,255,0.24); }
.btn-back svg { width: 20px; height: 20px; }

/* Shared bottom nav */
.sv-nav {
  position: absolute; bottom: 57px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 24px; z-index: 10;
}
.sv-btn-ghost {
  width: 270px; height: 48px;
  background: rgba(255,255,255,0.16); color: #ededed;
  font-family: var(--font-body); font-size: 16px; font-weight: 500;
  border-radius: 8px; border: none; cursor: pointer; letter-spacing: -0.1px;
  transition: opacity 120ms;
}
.sv-btn-primary {
  width: 270px; height: 48px;
  background: #f2f3e5; color: #1f1f25;
  font-family: var(--font-body); font-size: 16px; font-weight: 500;
  border-radius: 8px; border: none; cursor: pointer; letter-spacing: -0.1px;
  box-shadow: 0 1px 1px rgba(20,21,26,0.03); transition: opacity 120ms;
}
.sv-btn-ghost:active   { opacity: 0.75; }
.sv-btn-primary:active { opacity: 0.85; }

/* ── Screen 1: suggest ── */
.sv-title {
  position: absolute; top: 300px; left: 50%; transform: translateX(-50%);
  width: 613px; text-align: center; margin: 0;
  font-family: var(--font-display); font-weight: 400; font-size: 80px; line-height: 1.06;
  letter-spacing: 1.5px; color: #f2f3e5;
}
.sv-subtitle {
  position: absolute; top: 494px; left: 50%; transform: translateX(-50%);
  width: 357px; text-align: center; margin: 0;
  font-family: var(--font-body); font-size: 16px; font-weight: 500;
  line-height: 1.25; letter-spacing: -0.1px; color: #f2f3e5;
}

/* ── Screen 2: feedback ── */
.sv-reward-row {
  position: absolute; top: 274px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; z-index: 5;
}
.sv-reward-plus {
  font-family: var(--font-display); font-size: 32px; line-height: 40px;
  letter-spacing: -0.8px; color: #f2f3e5;
}
.sv-fb-title {
  position: absolute; top: 338px; left: 50%; transform: translateX(-50%);
  width: 457px; text-align: center; margin: 0;
  font-family: var(--font-display); font-weight: 400; font-size: 80px; line-height: 1.06;
  letter-spacing: 1.5px; color: #f2f3e5; z-index: 5;
}
.sv-bubble {
  position: absolute; top: 447px; left: 50%; transform: translateX(-50%);
  width: 457px; background: #b38aff; padding: 10px;
  display: flex; align-items: flex-start; gap: 12px; z-index: 5;
}
.sv-bubble-avatar {
  width: 48px; height: 48px; background: #f2f3e5;
  flex-shrink: 0; display: grid; place-items: center;
}
.sv-bubble-monster { position: relative; width: 40px; height: 40px; }
.sv-bubble-eyes {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 1px;
}
.sv-bubble-eye { width: 5.78px; height: 7.58px; display: block; }
.sv-bubble-msg {
  font-family: var(--font-body); font-size: 20px; font-weight: 500;
  color: #2f2f37; line-height: 1.1; letter-spacing: -0.4px; flex: 1; margin: 0;
}

/* ── s-feedback entry animation ── */
#s-feedback .sv-reward-row,
#s-feedback .sv-fb-title { transform: translateX(-50%) translateY(400px); opacity: 0; }
#s-feedback .sv-bubble    { transform: translateX(-50%) translateY(400px); opacity: 0; }
#s-feedback .sv-nav       { transform: translateX(-50%) translateY(200px); opacity: 0; }

#s-feedback.fb-entered .sv-reward-row,
#s-feedback.fb-entered .sv-fb-title {
  transform: translateX(-50%) translateY(0); opacity: 1;
  transition: transform 800ms cubic-bezier(0.75,0,0.3,0.99), opacity 400ms ease;
}
#s-feedback.fb-entered .sv-bubble {
  transform: translateX(-50%) translateY(0); opacity: 1;
  transition: transform 800ms cubic-bezier(0.75,0,0.3,0.99) 80ms, opacity 400ms ease 80ms;
}
#s-feedback.fb-phase2 .sv-nav {
  transform: translateX(-50%) translateY(0); opacity: 1;
  transition: transform 800ms cubic-bezier(0.75,0,0.3,0.99), opacity 400ms ease;
}

/* ── Video overlay (outside device) ── */
#vid-progress-wrap { opacity: 0; transition: opacity 200ms; }
#vid-overlay:hover #vid-progress-wrap { opacity: 1; }
#vid-progress::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; cursor: pointer; margin-top: -5px;
}
#vid-progress::-webkit-slider-runnable-track {
  background: linear-gradient(to right, #fff var(--pct,0%), rgba(255,255,255,0.25) var(--pct,0%));
  border-radius: 2px; height: 4px;
}

</style>
</head>
<body>

<!-- ── Video overlay — outside bp-device to avoid scale() rendering bug ── -->
<div id="vid-overlay" style="display:none; position:fixed; inset:0; background:#000; z-index:999;" onclick="togglePause(event)">
  <video id="vid-player" style="width:100%; height:100%; object-fit:contain; display:block;" playsinline preload="metadata"></video>
  <div id="vid-progress-wrap" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" onpointerdown="event.stopPropagation()"
       style="position:absolute; bottom:0; left:0; right:0; padding:16px 32px 20px; box-sizing:border-box;">
    <input id="vid-progress" type="range" min="0" max="100" value="0" step="0.1"
      onpointerdown="_isSeeking=true; _wasPlaying=!document.getElementById('vid-player').paused; document.getElementById('vid-player').pause();"
      oninput="var b=this; b.style.setProperty('--pct',b.value+'%');"
      onpointerup="_isSeeking=false; seekVideo(this.value); if(_wasPlaying) document.getElementById('vid-player').play(); _justSeeked=true; setTimeout(function(){_justSeeked=false;},300);"
      onpointercancel="_isSeeking=false;"
      style="width:100%; height:14px; -webkit-appearance:none; appearance:none; background:transparent; outline:none; cursor:pointer;">
  </div>
  <div id="vid-pause-icon" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:72px; height:72px; border-radius:50%; background:rgba(0,0,0,0.55); align-items:center; justify-content:center; pointer-events:none;">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="5" y="4" width="7" height="20" rx="2" fill="#fff"/><rect x="16" y="4" width="7" height="20" rx="2" fill="#fff"/></svg>
  </div>
  <button id="vid-back-btn" onclick="event.stopPropagation(); closeVideo()"
          style="position:absolute; top:24px; left:32px; width:48px; height:48px; background:rgba(255,255,255,0.16); border:none; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 15.8334L6.66667 10L12.5 4.16669" stroke="#f2f3e5" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="vid-end-btns" style="display:none; position:absolute; bottom:100px; right:32px; gap:12px;">
    <button onclick="event.stopPropagation(); playAgain()"
            style="background:rgba(255,255,255,0.16); border:none; border-radius:8px; padding:12px 24px; color:#fff; font-family:var(--font-body); font-size:16px; font-weight:500; cursor:pointer; letter-spacing:-0.1px;">Replay</button>
    <button onclick="event.stopPropagation(); completeVideo()"
            style="background:#f2f3e5; border:none; border-radius:8px; padding:12px 24px; color:#1f1f25; font-family:var(--font-body); font-size:16px; font-weight:500; cursor:pointer; letter-spacing:-0.1px;">Complete</button>
  </div>
</div>


<div class="bp-stage">
<div class="bp-device" id="device">

<div class="sb"><span>9:41 Mon Jun 6</span><span>100% 🔋</span></div>
<button class="btn-back" onclick="history.back()">
  <svg viewBox="0 0 20 20" fill="none">
    <path d="M12 5L7 10L12 15" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>


<!-- ════════════════════════════════════════════════════════════
     SCREEN 1 — Video suggestion
     ════════════════════════════════════════════════════════════ -->
<div class="screen active" id="s-suggest">
  <div class="sv-bg"></div>
  <div class="sv-dome"></div>

  <h1 class="sv-title">It's totally normal to feel this way.</h1>
  <p class="sv-subtitle">Want to watch a quick video that could help?</p>

  <div class="sv-nav">
    <button class="sv-btn-ghost"   onclick="window.location.href='today.html'">Maybe later</button>
    <button class="sv-btn-primary" onclick="onPlay()">Yes, show me</button>
  </div>
</div>


<!-- ════════════════════════════════════════════════════════════
     SCREEN 2 — Did this help?
     ════════════════════════════════════════════════════════════ -->
<div class="screen" id="s-feedback">
  <div class="sv-bg"></div>
  <div class="sv-dome"></div>

  <div class="sv-reward-row">
    <span class="sv-reward-plus">+1</span>
    <img src="./components/spark.svg" alt="spark" style="width:32px;height:32px;display:block;">
  </div>

  <h1 class="sv-fb-title">Did this help?</h1>

  <div class="sv-bubble">
    <div class="sv-bubble-avatar">
      <div class="sv-bubble-monster">
        <img src="./components/monster-butterfly.svg" alt="" style="position:absolute;width:36px;height:36px;top:2px;left:2px;">
        <div class="sv-bubble-eyes">
          <img class="sv-bubble-eye" src="./components/monster-eye.svg" alt="">
          <img class="sv-bubble-eye" src="./components/monster-eye.svg" alt="">
        </div>
      </div>
    </div>
    <p class="sv-bubble-msg">You made it through a tough moment and that counts.</p>
  </div>

  <div class="sv-nav">
    <button class="sv-btn-ghost"   onclick="window.location.href='today.html'">Not really</button>
    <button class="sv-btn-primary" onclick="window.location.href='today.html'">Yes, a bit!</button>
  </div>
</div>


</div><!-- /bp-device -->
</div><!-- /bp-stage -->

<script>
function scale() {
  document.getElementById('device').style.setProperty('--s', Math.min(innerWidth/1194, innerHeight/834)*0.96);
}
scale(); addEventListener('resize', scale);

// ── Video player ──────────────────────────────────────────────
var _vidDur     = 0;
var _isSeeking  = false;
var _wasPlaying = false;
var _justSeeked = false;

function onPlay() {
  const overlay = document.getElementById('vid-overlay');
  const player  = document.getElementById('vid-player');
  _vidDur = 0;
  player.src = './components/youve-done-hard-things.mp4';
  player.load();
  player.addEventListener('loadedmetadata', function() { _vidDur = player.duration; }, { once: true });
  overlay.style.display = 'block';
  document.getElementById('vid-end-btns').style.display = 'none';
  document.getElementById('vid-back-btn').style.display = 'flex';
  player.addEventListener('canplay', function() { player.play(); }, { once: true });
  player.addEventListener('ended', _onEnded, { once: true });
}

function _onEnded() {
  document.getElementById('vid-pause-icon').style.display = 'none';
  document.getElementById('vid-end-btns').style.display = 'flex';
  document.getElementById('vid-back-btn').style.display = 'none';
}

function playAgain() {
  var player = document.getElementById('vid-player');
  player.currentTime = 0;
  player.play();
  document.getElementById('vid-pause-icon').style.display = 'none';
  document.getElementById('vid-end-btns').style.display = 'none';
  document.getElementById('vid-back-btn').style.display = 'flex';
  player.addEventListener('ended', _onEnded, { once: true });
}

function closeVideo() {
  document.getElementById('vid-overlay').style.display = 'none';
  document.getElementById('vid-player').pause();
}

function completeVideo() {
  var overlay = document.getElementById('vid-overlay');
  var player  = document.getElementById('vid-player');
  player.pause();
  overlay.style.transition = 'opacity 400ms ease';
  overlay.style.opacity = '0';
  setTimeout(function() {
    overlay.style.display = 'none';
    overlay.style.transition = '';
    overlay.style.opacity = '';
    document.getElementById('s-suggest').classList.remove('active');
    var fb = document.getElementById('s-feedback');
    fb.classList.add('active');
    requestAnimationFrame(function() { requestAnimationFrame(function() {
      fb.classList.add('fb-entered');
      setTimeout(function() { fb.classList.add('fb-phase2'); }, 300);
    }); });
  }, 400);
}

function seekVideo(val) {
  var player = document.getElementById('vid-player');
  var dur = _vidDur || player.duration;
  if (dur && isFinite(dur) && !isNaN(dur)) {
    player.currentTime = (val / 100) * dur;
  }
}

function togglePause(e) {
  if (_justSeeked) return;
  var player = document.getElementById('vid-player');
  var icon   = document.getElementById('vid-pause-icon');
  if (player.paused) { player.play(); icon.style.display = 'none'; }
  else               { player.pause(); icon.style.display = 'flex'; }
}

(function updateProgress() {
  if (!_isSeeking) {
    var player = document.getElementById('vid-player');
    var bar    = document.getElementById('vid-progress');
    if (player && bar && player.duration) {
      var pct = (player.currentTime / player.duration) * 100;
      bar.value = pct;
      bar.style.setProperty('--pct', pct + '%');
    }
  }
  requestAnimationFrame(updateProgress);
})();
</script>
<script src="./content-loader.js"></script>
</body>
</html>
