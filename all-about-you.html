<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint — All about you</title>
<link rel="stylesheet" href="./foundations/tokens.css">
<style>

body { background: #0a0a0f; overflow: hidden; margin: 0; }
.bp-stage { position: fixed; inset: 0; display: grid; place-items: center; }
.bp-device {
  width: 1194px; height: 834px; position: relative; overflow: hidden;
  border-radius: 20px; transform-origin: center center;
  transform: scale(var(--s,1));
}

/* ─── Screen transitions ────────────────────────────────────── */
.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: block; }
.aay-content { position: absolute; inset: 0; }

/* ─── Status bar ────────────────────────────────────────────── */
.sb {
  position: absolute; top: 0; left: 0; right: 0; height: 24px; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 500;
  color: #fff; pointer-events: none;
}

/* ─── Shared green screens ──────────────────────────────────── */
.aay-shared-bg { position: absolute; inset: 0; background: #58b880; z-index: 0; pointer-events: none; }

.aay-bg-shape {
  position: absolute;
  width: 1189px; height: 1599px;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(1.38);
  pointer-events: none; z-index: 0;
}

.btn-back {
  position: absolute; top: 48px; left: 24px; z-index: 10;
  width: 48px; height: 48px; border-radius: 8px;
  background: rgba(255,255,255,0.16);
  border: none; cursor: pointer; display: grid; place-items: center;
  transition: background 120ms;
}
.btn-back:hover { background: rgba(255,255,255,0.24); }
.btn-back svg { width: 20px; height: 20px; }

.aay-counter {
  position: absolute; top: 62px; right: 24px; z-index: 10;
  font-family: var(--font-body); font-size: 16px; font-weight: 500;
  color: #737472; letter-spacing: -0.1px;
}

.aay-header {
  position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  z-index: 5; width: 351px;
}
.aay-pill {
  display: flex; align-items: center; gap: 8px;
  background: #2f2f37; border-radius: 99px;
  padding: 8px 12px;
  font-family: var(--font-display); font-weight: 400; font-size: 20px;
  color: #f2f3e5; line-height: 1.05;
}
.aay-title {
  font-family: var(--font-display); font-weight: 400; font-size: 32px;
  letter-spacing: -0.8px; color: #f2f3e5; margin: 0; line-height: 40px; text-align: center;
}

.aay-bubble {
  position: absolute; top: 190px; left: 50%; transform: translateX(-50%);
  width: 439px; background: #58b880; padding: 10px;
  display: flex; align-items: flex-start; gap: 12px; z-index: 5;
}
.aay-avatar {
  width: 48px; height: 48px; background: #f2f3e5;
  flex-shrink: 0; display: grid; place-items: center;
}
.aay-monster { position: relative; width: 40px; height: 40px; }
.aay-butterfly { position: absolute; width: 36px; height: 36px; top: 2px; left: 2px; }
.aay-eyes {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 1px;
}
.aay-eye { width: 5.78px; height: 7.58px; display: block; }
.aay-msg {
  font-family: var(--font-body); font-size: 20px; font-weight: 500;
  color: #2f2f37; line-height: 1.1; letter-spacing: -0.4px; flex: 1;
}

.aay-nav {
  position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; z-index: 20;
}
.btn-aay-back {
  width: 48px; height: 48px; border-radius: 8px;
  background: rgba(255,255,255,0.16);
  border: none; cursor: pointer; display: grid; place-items: center;
  transition: opacity 120ms;
}
.btn-aay-back:active { opacity: 0.75; }
.btn-aay-next {
  width: 270px; height: 48px;
  background: #f2f3e5; color: #1f1f25;
  font-family: var(--font-body); font-size: 16px; font-weight: 500;
  border-radius: 8px; border: none; cursor: pointer; transition: opacity 120ms;
}
.btn-aay-next:active { opacity: 0.85; }
.btn-aay-save {
  width: 270px; height: 48px;
  background: #f2f3e5; color: #1f1f25;
  font-family: var(--font-body); font-size: 16px; font-weight: 500;
  border-radius: 8px; border: none; cursor: pointer; transition: opacity 120ms;
}
.btn-aay-save:active { opacity: 0.85; }


/* ══════════════════════════════════════════════════════════════
   SCREEN 1 — Arc slider
   ══════════════════════════════════════════════════════════════ */

.aay-slider-wrap {
  position: absolute; top: 308px; left: 50%; transform: translateX(-50%); z-index: 5;
}

.arc-slider {
  position: relative; width: 532px; height: 310px;
  overflow: visible; outline: none;
  cursor: grab; -webkit-user-select: none; user-select: none;
}
.arc-slider.is-dragging { cursor: grabbing; }
.arc-slider svg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
.arc-slider__hit { position: absolute; inset: 0; }
.arc-slider__thumb {
  position: absolute; width: 104px; height: 104px; border-radius: 50%;
  background: #58b880; border: 10px solid #2f2f37;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; line-height: 1;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: none; will-change: left, top, transform;
  filter: drop-shadow(0 4px 20px rgba(0,0,0,.5));
  transition: none;
}
.arc-slider__thumb.is-snapping {
  transition: left .4s cubic-bezier(.34,1.56,.64,1), top .4s cubic-bezier(.34,1.56,.64,1);
}
.arc-slider.is-dragging .arc-slider__thumb {
  transform: translate(-50%, -50%) scale(1.06);
  transition: transform .12s ease;
}
.arc-slider__pill {
  position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
  background: #2f2f37; border-radius: 99px; padding: 0 24px;
  min-width: 160px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.arc-slider__pill span {
  color: #f2f3e5; font-family: var(--font-body);
  font-size: 16px; font-weight: 600; text-align: center;
}


/* ══════════════════════════════════════════════════════════════
   SCREEN 2 — Eating grid
   ══════════════════════════════════════════════════════════════ */

.eat-grid {
  position: absolute; top: 282px; left: 50%; transform: translateX(-50%);
  width: 764px; z-index: 5;
  display: grid; grid-template-columns: repeat(4, 179px); gap: 16px;
}
.eat-block {
  background: #2f2f37; border: 1px solid rgba(92,92,101,0.3); border-radius: 8px;
  height: 94px; padding: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer; transition: background 160ms, border-color 160ms;
  font-family: inherit;
}
.eat-block:hover { background: #3a3a44; }
.eat-block.sel { background: #3a3a44; border: 3px solid #f2f3e5; }
.eat-icon {
  width: 40px; height: 40px; flex-shrink: 0;
  background: #1f1f25; border: 1px solid rgba(92,92,101,0.3);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.eat-emoji { font-size: 18px; line-height: 1; }
.eat-label {
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  color: #f2f3e5; text-align: center; line-height: 1.3;
}

.eat-block--add .eat-label { color: #a4a59f; }
.eat-block--input {
  grid-column: span 2; width: auto; height: 94px; box-sizing: border-box;
  flex-direction: row; gap: 10px; padding: 0 12px; cursor: default;
}
.eat-block--input:hover { background: #2f2f37; }
.eat-input-field {
  flex: 1; background: none; border: none; outline: none;
  color: #f2f3e5; font-family: var(--font-body); font-size: 14px; font-weight: 600; min-width: 0;
}
.eat-input-field::placeholder { color: #a4a59f; }
.eat-confirm-btn {
  width: 36px; height: 36px; background: none; border: none; padding: 0;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: opacity 120ms;
}
.eat-confirm-btn:active { opacity: 0.75; }
.eat-emoji-picker {
  position: absolute; background: #2b2b32; border: 1px solid #444450;
  border-radius: 12px; width: 282px; z-index: 200;
  box-shadow: 0 8px 32px rgba(0,0,0,0.7); display: none; overflow: hidden;
}
.eat-picker-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  padding: 8px; max-height: 228px; overflow-y: auto;
}
.eat-picker-grid button {
  background: none; border: none; font-size: 24px; line-height: 1;
  padding: 5px 2px; border-radius: 6px; cursor: pointer;
  transition: background 80ms; text-align: center;
}
.eat-picker-grid button:hover { background: #3a3a44; }
.eat-picker-overlay { position: absolute; inset: 0; z-index: 150; display: none; }


/* ══════════════════════════════════════════════════════════════
   SCREEN 3 — Completed
   ══════════════════════════════════════════════════════════════ */
#s-done { background: #1f1f25; }

.done-center {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.done-reward-row { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
.done-reward-text {
  font-family: var(--font-display); font-weight: 400; font-size: 32px;
  color: #f2f3e5; line-height: 1;
}
.done-card-wrap {
  width: 237px; height: 353px; position: relative;
  animation: float 3s ease-in-out infinite; margin-bottom: 28px;
}
.done-card-img { width: 100%; height: 100%; border-radius: 19px; display: block; }
@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-10px); }
}
.done-title {
  font-family: var(--font-display); font-weight: 400; font-size: 80px; line-height: 1;
  color: #f2f3e5; letter-spacing: 1px; text-align: center; margin: 0;
}

</style>
</head>

<script>
const EMOTION_NAMES = {
  curious:'Curious', happy:'Happy', excited:'Excited', okay:'Okay', grateful:'Grateful',
  hopeful:'Hopeful', meh:'Meh', neutral:'Neutral', idontknow:"I don't know", sad:'Sad',
  tired:'Tired', lonely:'Lonely', angry:'Angry', stressed:'Stressed', anxious:'Anxious',
};

(function fillBubble() {
  const sleep  = localStorage.getItem('bp_sleep_answer') || 'okay';
  const keys   = JSON.parse(localStorage.getItem('bp_mood_emotions') || '[]');
  const names  = keys.length
    ? keys.map(k => (EMOTION_NAMES[k] || k).toLowerCase())
    : ['okay'];
  const emotion = names.length > 1
    ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1]
    : names[0];
  const msg = document.getElementById('connMsg');
  if (msg) {
    msg.textContent = `You said you slept ${sleep} last night, and today felt ${emotion} — how much do you think they're connected?`;
  }
})();

let _deviceScale = Math.min(innerWidth / 1194, innerHeight / 834) * 0.96;
function scale() {
  _deviceScale = Math.min(innerWidth / 1194, innerHeight / 834) * 0.96;
  document.getElementById('device').style.setProperty('--s', _deviceScale);
}
scale(); addEventListener('resize', scale);

let cur = 's-connection';
let _aayAnimating = false;
const AAY_ORDER = ['s-connection', 's-eating'];
const AAY_DUR = 800;
const AAY_BEZ = 'cubic-bezier(0.81,0,0.26,0.98)';

const AAY_SCREEN_DATA = {
  's-connection': {
    counter: '1/2',
    navLabel: 'Next', navClass: 'btn-aay-next',
    navFn: () => goTo('s-eating'),
    backFn: () => history.back(),
  },
  's-eating': {
    counter: '2/2',
    navLabel: 'Save', navClass: 'btn-aay-save',
    navFn: () => saveAll(),
    backFn: () => goTo('s-connection'),
  },
};

function updateShared(id) {
  const cfg = AAY_SCREEN_DATA[id];
  if (!cfg) return;
  document.getElementById('aayCounter').textContent = cfg.counter;
  const navBtn = document.getElementById('aayNavBtn');
  navBtn.textContent = cfg.navLabel;
  navBtn.className   = cfg.navClass;
  navBtn.onclick     = cfg.navFn;
  document.getElementById('aayBack').onclick = cfg.backFn;
}

function goTo(id) {
  if (_aayAnimating || id === cur) return;
  _aayAnimating = true;
  updateShared(id);
  const dir         = AAY_ORDER.indexOf(id) > AAY_ORDER.indexOf(cur) ? 1 : -1;
  const fromEl      = document.getElementById(cur);
  const toEl        = document.getElementById(id);
  const fromContent = fromEl.querySelector('.aay-content');
  const toContent   = toEl.querySelector('.aay-content');

  fromEl.style.display = 'block';
  toEl.style.display   = 'block';
  toContent.style.transition = 'none';
  toContent.style.transform  = `translateX(${dir * 100}%)`;
  toContent.offsetWidth;

  const tr = `transform ${AAY_DUR}ms ${AAY_BEZ}`;
  fromContent.style.transition = tr;
  fromContent.style.transform  = `translateX(${dir * -100}%)`;
  toContent.style.transition   = tr;
  toContent.style.transform    = 'translateX(0)';

  setTimeout(() => {
    fromEl.classList.remove('active');
    fromEl.style.display = '';
    fromContent.style.transition = '';
    fromContent.style.transform  = '';
    toEl.classList.add('active');
    toEl.style.display = '';
    toContent.style.transition = '';
    toContent.style.transform  = '';
    cur = id;
    _aayAnimating = false;
  }, AAY_DUR + 50);
}

function saveAll() {
  localStorage.setItem('bp_about_done', '1');
  setTimeout(() => { window.location.href = 'completed.html?card=about'; }, 400);
}

// ─── Arc slider constants ─────────────────────────────────────
const ARC_CX = 263, ARC_CY = 247, ARC_RM = 190.5;
const ARC_FILL_START = 175, ARC_TRACK_END = 5;
const ARC_A_MAX = 170, ARC_A_MIN = 10;
const DEG = Math.PI / 180;
const rnd = n => Math.round(n * 10) / 10;

function arcPt(r, deg) {
  return [ARC_CX + r * Math.cos(deg * DEG), ARC_CY - r * Math.sin(deg * DEG)];
}
function arcAng(x, y) {
  return Math.atan2(ARC_CY - y, x - ARC_CX) / DEG;
}
function arcPath(from, to) {
  if (from - to < 0.4) to = from - 0.4;
  const [x1,y1] = arcPt(ARC_RM, from), [x2,y2] = arcPt(ARC_RM, to);
  return `M${rnd(x1)},${rnd(y1)} A${ARC_RM},${ARC_RM} 0 ${(from-to)>=180?1:0},1 ${rnd(x2)},${rnd(y2)}`;
}

// ─── Connection slider (5 stops) ─────────────────────────────
const CONN_LEVELS = [
  { e:'😶', t:'Not at all' },
  { e:'🤔', t:'A little' },
  { e:'💭', t:'Somewhat' },
  { e:'💡', t:'Quite a bit' },
  { e:'🤯', t:'A lot' },
];

(function initConnSlider() {
  const NS = 'http://www.w3.org/2000/svg';
  const n = CONN_LEVELS.length;
  const stops = CONN_LEVELS.map((_, i) => ARC_A_MAX - (i / (n-1)) * (ARC_A_MAX - ARC_A_MIN));

  document.getElementById('arcTrack-conn').setAttribute('d', arcPath(ARC_FILL_START, ARC_TRACK_END));

  const dotsG = document.getElementById('arcDots-conn');
  const dotEls = stops.map(a => {
    const [dx, dy] = arcPt(ARC_RM, a);
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', rnd(dx)); c.setAttribute('cy', rnd(dy));
    c.setAttribute('r', '6'); c.setAttribute('fill', '#18181f');
    dotsG.appendChild(c); return c;
  });

  let arcAngle = stops[2];

  function arcMove(a) {
    a = Math.max(ARC_A_MIN, Math.min(ARC_A_MAX, a)); arcAngle = a;
    document.getElementById('arcFill-conn').setAttribute('d', arcPath(ARC_FILL_START, a));
    const [tx, ty] = arcPt(ARC_RM, a);
    const thumb = document.getElementById('arcThumb-conn');
    thumb.style.left = tx+'px'; thumb.style.top = ty+'px';
    const ni = stops.reduce((b,sa,i) => Math.abs(a-sa) < Math.abs(a-stops[b]) ? i : b, 0);
    document.getElementById('arcEmoji-conn').textContent = CONN_LEVELS[ni].e;
    document.getElementById('arcLabel-conn').textContent = CONN_LEVELS[ni].t;
    dotEls.forEach((c,i) => c.setAttribute('fill', i===ni ? 'transparent' : '#18181f'));
  }

  function arcSnap(v, noAnim) {
    const thumb = document.getElementById('arcThumb-conn');
    if (!noAnim) {
      thumb.classList.add('is-snapping');
      thumb.addEventListener('transitionend', () => thumb.classList.remove('is-snapping'), { once: true });
    }
    arcMove(stops[v]);
  }

  function nearest(a) { return stops.reduce((b,sa,i) => Math.abs(a-sa) < Math.abs(a-stops[b]) ? i : b, 0); }

  const sliderEl = document.getElementById('arc-conn');
  const hitEl    = document.getElementById('arcHit-conn');
  const thumbEl  = document.getElementById('arcThumb-conn');
  let dragging = false;

  function cta(e) {
    const t = e.touches ? e.touches[0] : e;
    const r = sliderEl.getBoundingClientRect();
    return arcAng((t.clientX - r.left) / _deviceScale, (t.clientY - r.top) / _deviceScale);
  }
  function onStart(e) { dragging=true; sliderEl.classList.add('is-dragging'); thumbEl.classList.remove('is-snapping'); e.preventDefault(); arcMove(cta(e)); }
  function onMove(e)  { if (!dragging) return; e.preventDefault(); arcMove(cta(e)); }
  function onEnd()    { if (!dragging) return; dragging=false; sliderEl.classList.remove('is-dragging'); arcSnap(nearest(arcAngle)); }

  hitEl.addEventListener('mousedown', onStart);
  thumbEl.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
  hitEl.addEventListener('touchstart', onStart, { passive: false });
  thumbEl.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onEnd);
  sliderEl.addEventListener('keydown', e => {
    const ni = nearest(arcAngle);
    if (e.key === 'ArrowRight') arcSnap(Math.min(ni+1, n-1));
    if (e.key === 'ArrowLeft')  arcSnap(Math.max(ni-1, 0));
  });

  arcSnap(2, true);
})();

const CHK_SVG = `<svg width="36" height="36" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="17" fill="#f2f3e5"/><path d="M11 18l5 5 9-9" stroke="#1f1f25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function eatAddOther(el) {
  const div = document.createElement('div');
  div.className = 'eat-block eat-block--input sel';
  div.innerHTML = `
    <div class="eat-icon" style="cursor:pointer;flex-shrink:0" onclick="eatShowPicker(this)">
      <span class="eat-emoji">👀</span>
    </div>
    <input class="eat-input-field" placeholder="Write down...">
    <div class="eat-confirm-btn" onclick="eatConfirmAdd(this.closest('.eat-block'))">${CHK_SVG}</div>`;
  el.parentNode.replaceChild(div, el);
  div.querySelector('.eat-input-field').focus();
  div.querySelector('.eat-input-field').addEventListener('keydown', e => {
    if (e.key === 'Enter') eatConfirmAdd(div);
  });
}

function eatConfirmAdd(el) {
  const val   = el.querySelector('.eat-input-field').value.trim();
  const emoji = el.querySelector('.eat-emoji').textContent;
  if (!val) { eatRevertAdd(el); return; }
  const newBlock = document.createElement('button');
  newBlock.className = 'eat-block sel';
  newBlock.onclick = function() { this.classList.toggle('sel'); };
  newBlock.innerHTML = `<div class="eat-icon"><span class="eat-emoji">${emoji}</span></div><span class="eat-label">${val}</span>`;
  el.parentElement.insertBefore(newBlock, el);
  eatRevertAdd(el);
}

function eatRevertAdd(el) {
  const btn = document.createElement('button');
  btn.className = 'eat-block eat-block--add';
  btn.onclick = function() { eatAddOther(this); };
  btn.innerHTML = `<div class="eat-icon"><span style="font-size:20px;color:#a4a59f">+</span></div><span class="eat-label">Add other</span>`;
  el.parentNode.replaceChild(btn, el);
}

function eatBuildPicker() {
  const div = document.createElement('div');
  div.className = 'eat-emoji-picker';
  div.innerHTML = `<div class="eat-picker-grid">${
    EAT_PICKER_EMOJI.map(e => `<button onclick="event.stopPropagation();eatSelectEmoji('${e}')">${e}</button>`).join('')
  }</div>`;
  return div;
}

function eatShowPicker(iconEl) {
  const screen = document.getElementById('s-eating');
  let overlay = screen.querySelector('.eat-picker-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.className = 'eat-picker-overlay';
    overlay.onclick = () => eatHidePicker();
    screen.appendChild(overlay);
  }
  let picker = screen.querySelector('.eat-emoji-picker');
  if (!picker) { picker = eatBuildPicker(); screen.appendChild(picker); }
  picker._iconEl = iconEl;

  const device = document.getElementById('device');
  const dRect  = device.getBoundingClientRect();
  const iRect  = iconEl.getBoundingClientRect();
  const scale  = dRect.width / 1194;
  const cx = (iRect.left - dRect.left) / scale;
  const cy = (iRect.top  - dRect.top)  / scale;
  const iH = iRect.height / scale;
  const pw = 282, ph = 244;
  let pl = Math.max(8, Math.min(cx - 20, 1194 - pw - 8));
  let pt = cy - ph - 8;
  if (pt < 50) pt = cy + iH + 8;
  picker.style.left = pl + 'px';
  picker.style.top  = pt + 'px';

  overlay.style.display = 'block';
  picker.style.display  = 'block';
}

function eatHidePicker() {
  const screen = document.getElementById('s-eating');
  if (!screen) return;
  const overlay = screen.querySelector('.eat-picker-overlay');
  const picker  = screen.querySelector('.eat-emoji-picker');
  if (overlay) overlay.style.display = 'none';
  if (picker)  picker.style.display  = 'none';
}

function eatSelectEmoji(emoji) {
  const screen = document.getElementById('s-eating');
  const picker = screen && screen.querySelector('.eat-emoji-picker');
  if (picker && picker._iconEl) picker._iconEl.querySelector('.eat-emoji').textContent = emoji;
  eatHidePicker();
}
