<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint — Quote</title>
<script>(function(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1194,innerHeight/834)*0.96);})()</script>
<link rel="stylesheet" href="./foundations/tokens.css">
<style>

body { background: #0a0a0f; overflow: hidden; margin: 0; }
.bp-stage { position: fixed; inset: 0; display: grid; place-items: center; }
.bp-device {
  width: 1194px; height: 834px; position: relative; overflow: hidden;
  border-radius: 20px; transform-origin: center center;
  transform: scale(var(--s,1));
  background: #219653;
  clip-path: inset(834px 0 0 0);
}

/* ─── Status bar ─────────────────────────────────────── */
.sb {
  position: absolute; top: 0; left: 0; right: 0; height: 24px; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 500;
  color: rgba(255,255,255,0.9); pointer-events: none;
}

/* ─── Back button ────────────────────────────────────── */
.back-btn {
  position: absolute; top: 48px; left: 24px; z-index: 20;
  width: 48px; height: 48px; border-radius: 8px;
  background: rgba(255,255,255,0.16);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 140ms;
}
.back-btn:hover { background: rgba(255,255,255,0.24); }

/* ─── Quote content ──────────────────────────────────── */
.quote-content {
  position: absolute;
  left: 145px; top: 126px; width: 903px;
  display: flex; flex-direction: column; gap: 24px;
  text-align: center; align-items: center;
}
.quote-attr {
  font-family: var(--font-body); font-size: 20px; font-weight: 500;
  line-height: 1.1; letter-spacing: -0.4px;
  color: #f2f3e5; margin: 0;
}
.quote-text {
  font-family: var(--font-display); font-weight: 400; font-size: 64px;
  line-height: 1.06; letter-spacing: 1.5px;
  color: #f2f3e5; margin: 0;
}

/* ─── Illustration ───────────────────────────────────── */
.quote-illus {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 1194px;
  pointer-events: none;
  display: block;
}

#quote-inner {
  position: absolute; inset: 0;
}

</style>
</head>
<body>

<div class="bp-stage">
<div class="bp-device" id="device">
<div id="quote-inner">

  <div class="sb">
    <span>9:41 Mon Jun 6</span>
    <span>100% 🔋</span>
  </div>

  <button class="back-btn" onclick="sessionStorage.setItem('bp_enter_anim','1'); window.location.href='today.html'">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M12.5 15L7.5 10L12.5 5" stroke="#f2f3e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="quote-content">
    <p class="quote-attr">– Karl Anthony Tawns, NBA All Star</p>
    <p class="quote-text">"Resilience isn't just a buzz word. It's having the guts to chase your dreams<br>no matter what".</p>
  </div>

  <img class="quote-illus" src="./components/illu-quote.png" alt="">

</div>
</div>
</div>

<script>
function scale() {
  var s = Math.min(innerWidth / 1194, innerHeight / 834) * 0.96;
  document.getElementById('device').style.setProperty('--s', s);
}
scale(); addEventListener('resize', scale);

// Entry reveal — clip-path from bottom upward, no delay
requestAnimationFrame(function() { requestAnimationFrame(function() {
  var d = document.getElementById('device');
  d.style.transition = 'clip-path 800ms cubic-bezier(0.81, 0, 0.26, 0.98)';
  d.style.clipPath = 'inset(0px 0 0 0)';
  setTimeout(function() { d.style.clipPath = 'none'; d.style.transition = ''; }, 810);
}); });
</script>
</body>
</html>
